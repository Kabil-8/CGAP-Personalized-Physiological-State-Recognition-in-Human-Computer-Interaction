<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050">
  <defs>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#1d4ed8"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="teal" x1="0" x2="1"><stop stop-color="#0f766e"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
    <linearGradient id="purple" x1="0" x2="1"><stop stop-color="#6d28d9"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="green" x1="0" x2="1"><stop stop-color="#15803d"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-opacity=".16"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker>
    <style>
      .title{font:700 34px Arial;fill:#0f172a}.subtitle{font:400 17px Arial;fill:#475569}
      .boxTitle{font:700 20px Arial;fill:white}.boxText{font:400 16px Arial;fill:white}
      .small{font:400 14px Arial;fill:#334155}.section{font:700 18px Arial;fill:#0f172a}
      .arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#64748b;stroke-width:2.5;stroke-dasharray:9 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="1050" fill="#f8fafc"/>
  <text x="900" y="54" text-anchor="middle" class="title">Overall Architecture of the CGAP Real-Time HCI Framework</text>
  <text x="900" y="84" text-anchor="middle" class="subtitle">Leakage-free multimodal physiological-state recognition with online personalisation</text>

  <text x="75" y="135" class="section">1. Data acquisition</text>
  <rect x="70" y="155" width="300" height="180" rx="18" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="220" y="195" text-anchor="middle" class="boxTitle">WESAD wearable signals</text>
  <text x="95" y="232" class="boxText">• ACC: movement dynamics</text><text x="95" y="260" class="boxText">• BVP: cardiovascular response</text><text x="95" y="288" class="boxText">• EDA: sympathetic arousal</text><text x="95" y="316" class="boxText">• Temperature: peripheral response</text>

  <text x="430" y="135" class="section">2. Window processing and EDA</text>
  <rect x="420" y="155" width="310" height="180" rx="18" fill="url(#teal)" filter="url(#shadow)"/>
  <text x="575" y="195" text-anchor="middle" class="boxTitle">Window construction</text>
  <text x="445" y="235" class="boxText">Fixed participant windows</text><text x="445" y="263" class="boxText">Mean, standard deviation</text><text x="445" y="291" class="boxText">Minimum and maximum</text><text x="445" y="319" class="boxText">EDA: class and subject checks</text>

  <text x="790" y="135" class="section">3. Validated feature space</text>
  <rect x="780" y="155" width="300" height="180" rx="18" fill="url(#purple)" filter="url(#shadow)"/>
  <text x="930" y="195" text-anchor="middle" class="boxTitle">24 sensor features</text>
  <text x="805" y="235" class="boxText">12 ACC features</text><text x="805" y="263" class="boxText">4 BVP features</text><text x="805" y="291" class="boxText">4 EDA features</text><text x="805" y="319" class="boxText">4 temperature features</text>

  <text x="1135" y="135" class="section">4. Leakage control</text>
  <rect x="1125" y="155" width="300" height="180" rx="18" fill="#334155" filter="url(#shadow)"/>
  <text x="1275" y="195" text-anchor="middle" class="boxTitle">Participant-independent split</text>
  <text x="1150" y="235" class="boxText">Leave one participant out</text><text x="1150" y="263" class="boxText">Training-only imputation</text><text x="1150" y="291" class="boxText">Training-only scaling</text><text x="1150" y="319" class="boxText">Exclude label-derived columns</text>

  <path d="M370 245 H420" class="arrow"/><path d="M730 245 H780" class="arrow"/><path d="M1080 245 H1125" class="arrow"/>

  <text x="75" y="405" class="section">5. CGAP learning architecture</text>
  <rect x="70" y="430" width="440" height="220" rx="18" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="290" y="470" text-anchor="middle" class="boxTitle">Global learning branch</text>
  <text x="100" y="512" class="boxText">Extra-Trees classifier</text><text x="100" y="542" class="boxText">Learns general cross-participant patterns</text><text x="100" y="572" class="boxText">Outputs class probabilities</text><text x="100" y="612" class="boxText">Stable initial prediction</text>

  <rect x="560" y="430" width="440" height="220" rx="18" fill="url(#purple)" filter="url(#shadow)"/>
  <text x="780" y="470" text-anchor="middle" class="boxTitle">Online adaptation branch</text>
  <text x="590" y="512" class="boxText">Scaled SGD classifier</text><text x="590" y="542" class="boxText">Predicts the current window first</text><text x="590" y="572" class="boxText">Receives labelled feedback afterward</text><text x="590" y="612" class="boxText">Updates to user-specific patterns</text>

  <rect x="1050" y="430" width="370" height="220" rx="18" fill="url(#teal)" filter="url(#shadow)"/>
  <text x="1235" y="470" text-anchor="middle" class="boxTitle">Probability fusion</text>
  <text x="1080" y="515" class="boxText">Global probability</text><text x="1080" y="545" class="boxText">+ online probability</text><text x="1080" y="575" class="boxText">Weighted adaptive blend</text><text x="1080" y="615" class="boxText">Final 3-class decision</text>

  <path d="M1275 335 V390 H290 V430" class="arrow"/><path d="M1275 335 V390 H780 V430" class="arrow"/>
  <path d="M510 540 H560" class="arrow"/><path d="M1000 540 H1050" class="arrow"/>

  <text x="75" y="720" class="section">6. Evaluation and deployment</text>
  <rect x="70" y="750" width="330" height="170" rx="18" fill="#0f766e" filter="url(#shadow)"/>
  <text x="235" y="790" text-anchor="middle" class="boxTitle">Evaluation</text>
  <text x="95" y="832" class="boxText">15-subject LOSO × 3 seeds</text><text x="95" y="862" class="boxText">Accuracy, balanced accuracy</text><text x="95" y="892" class="boxText">Macro-F1, calibration, ablation</text>

  <rect x="470" y="750" width="350" height="170" rx="18" fill="#475569" filter="url(#shadow)"/>
  <text x="645" y="790" text-anchor="middle" class="boxTitle">Real-time HCI state</text>
  <text x="495" y="832" class="boxText">Baseline / stress / amusement</text><text x="495" y="862" class="boxText">Confidence-aware prediction</text><text x="495" y="892" class="boxText">Continuous user adaptation</text>

  <rect x="890" y="750" width="530" height="170" rx="18" fill="url(#green)" filter="url(#shadow)"/>
  <text x="1155" y="790" text-anchor="middle" class="boxTitle">Adaptive interface response</text>
  <text x="915" y="832" class="boxText">Adjust notifications, workload, feedback, or interaction intensity</text><text x="915" y="862" class="boxText">Use predicted state to support personalised HCI behaviour</text><text x="915" y="892" class="boxText">Feedback returns to online adaptation</text>

  <path d="M1235 650 V700 H235 V750" class="arrow"/><path d="M1235 650 V700 H645 V750" class="arrow"/><path d="M820 835 H890" class="arrow"/>
  <path d="M1155 750 V690 H780 V650" class="dash"/>
  <text x="1175" y="684" class="small">labelled feedback after prediction</text>

  <rect x="70" y="970" width="1350" height="42" rx="10" fill="#e2e8f0"/>
  <text x="745" y="997" text-anchor="middle" class="small">Figure 1. Overall project architecture: data acquisition → EDA → leakage-controlled learning → adaptive prediction → HCI response.</text>
</svg>
